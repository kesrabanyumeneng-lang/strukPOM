<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SP - Struk POM</title>
  <style>
    :root {
      --bg-dark: #121318;
      --card-bg: #1c1e24;
      --card-border: #2a2d37;
      --accent: #00e676;
      --text-main: #ffffff;
      --text-sub: #9e9e9e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 12px; }

    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; margin-bottom: 12px; }
    .app-title { font-size: 18px; font-weight: bold; }

    /* Dashboard Grid (Seperti Screenshot Google Play) */
    .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .grid-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
    }
    .grid-card:active { background: #252830; }
    .card-icon { font-size: 20px; color: var(--accent); }
    .card-title { font-size: 14px; font-weight: 600; }
    .card-desc { font-size: 11px; color: var(--text-sub); }

    /* Section Views */
    .section-view { display: none; background: var(--card-bg); border-radius: 10px; padding: 16px; border: 1px solid var(--card-border); }
    .active-view { display: block; }

    /* Form Styles */
    .form-group { margin-bottom: 12px; }
    label { font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 10px; background: #121318; border: 1px solid var(--card-border);
      border-radius: 6px; color: #fff; font-size: 14px;
    }
    
    /* Quick Nominal Buttons */
    .quick-buttons { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .btn-quick {
      background: #2a2d37; border: none; color: #fff; padding: 6px 10px;
      border-radius: 4px; font-size: 12px; cursor: pointer;
    }

    /* Action Buttons */
    .btn-primary {
      width: 100%; background: var(--accent); color: #000; font-weight: bold;
      padding: 12px; border: none; border-radius: 6px; margin-top: 10px; cursor: pointer;
    }

    /* Struk Thermal Preview */
    .receipt-preview {
      background: #fff; color: #000; font-family: 'Courier New', monospace;
      padding: 14px; font-size: 12px; border-radius: 4px; white-space: pre-wrap; margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="top-bar">
    <div class="app-title">Struk POM</div>
    <button onclick="showSection('dashboard')" style="background:none; border:none; color:var(--accent);">Menu Utama</button>
  </div>

  <!-- Main Dashboard Grid -->
  <div id="dashboard" class="grid-container">
    <div class="grid-card" onclick="showSection('form-pom')">
      <div class="card-icon">⛽</div>
      <div class="card-title">POM</div>
      <div class="card-desc">Catat transaksi BBM</div>
    </div>
    <div class="grid-card" onclick="showSection('histori')">
      <div class="card-icon">📋</div>
      <div class="card-title">Histori</div>
      <div class="card-desc">Riwayat transaksi</div>
    </div>
    <div class="grid-card" onclick="showSection('bbm')">
      <div class="card-icon">💵</div>
      <div class="card-title">Harga BBM</div>
      <div class="card-desc">Kelola harga produk</div>
    </div>
    <div class="grid-card" onclick="showSection('operator')">
      <div class="card-icon">👤</div>
      <div class="card-title">Operator</div>
      <div class="card-desc">Tambah nama petugas</div>
    </div>
  </div>

  <!-- Form Transaksi POM -->
  <div id="form-pom" class="section-view">
    <h3>Input Transaksi POM</h3>
    <br>
    <div class="form-group">
      <label>Jenis BBM</label>
      <select id="jenisBBM">
        <option value="Pertalite">Pertalite (Rp 10.000)</option>
        <option value="Pertamax">Pertamax (Rp 12.950)</option>
        <option value="Solar">Solar (Rp 6.800)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Total Pembelian (Rp)</label>
      <input type="number" id="totalBayar" placeholder="50000">
      <div class="quick-buttons">
        <button class="btn-quick" onclick="setNominal(10000)">+10.000</button>
        <button class="btn-quick" onclick="setNominal(20000)">+20.000</button>
        <button class="btn-quick" onclick="setNominal(50000)">Rp 50.000</button>
        <button class="btn-quick" onclick="setNominal(100000)">Rp 100.000</button>
      </div>
    </div>

    <div class="form-group">
      <label>Nomor Polisi (Nopol)</label>
      <input type="text" id="nopol" placeholder="B 1234 ABC">
    </div>

    <button class="btn-primary" onclick="generateAndPrint()">Cetak Thermal (RawBT)</button>
    
    <!-- Preview Struk -->
    <div id="receiptPreview" class="receipt-preview" style="display:none;"></div>
  </div>

  <script>
    function showSection(id) {
      document.querySelectorAll('.section-view').forEach(el => el.classList.remove('active-view'));
      if(id !== 'dashboard') {
        document.getElementById(id).classList.add('active-view');
      }
    }

    function setNominal(val) {
      document.getElementById('totalBayar').value = val;
    }

    function generateAndPrint() {
      const bbm = document.getElementById('jenisBBM').value;
      const total = parseInt(document.getElementById('totalBayar').value) || 0;
      const nopol = document.getElementById('nopol').value || "-";
      const tgl = new Date().toLocaleString('id-ID');

      const textReceipt = 
`        SPBU BANYUMENENG
================================
Tanggal : ${tgl}
Nopol   : ${nopol}
Produk  : ${bbm}
Total   : Rp ${total.toLocaleString('id-ID')}
================================
    Terima Kasih / Selamat Jalan
`;

      // Tampilkan Preview Struk Teks
      const prevEl = document.getElementById('receiptPreview');
      prevEl.style.display = 'block';
      prevEl.innerText = textReceipt;

      // Cetak Langsung ke Printer Bluetooth via RawBT Intent
      const rawbtUrl = "intent:" + encodeURIComponent(textReceipt) + "#Intent;scheme=rawbt;package=ru.is5.rawbtprinter;end;";
      window.location.href = rawbtUrl;
    }
  </script>
</body>
</html>
