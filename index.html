<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SP - Struk POM/SPBU</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #121418;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="p-4 max-w-md mx-auto flex flex-col min-h-screen justify-between">

  <!-- Header -->
  <div>
    <header class="flex justify-between items-center py-4 mb-2">
      <div class="flex items-center space-x-3">
        <button class="text-gray-300 hover:text-white">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <div>
          <h1 class="text-xl font-bold leading-none">SP</h1>
          <span class="text-xs text-gray-400">v1.17.054</span>
        </div>
      </div>
      <button class="text-gray-300 hover:text-white">
        <i data-lucide="gift" class="w-6 h-6"></i>
      </button>
    </header>

    <!-- Status Koneksi Google Sheets API -->
    <div id="status-card" class="bg-gray-800/80 p-3 rounded-xl border border-gray-700/50 mb-4 text-xs text-gray-300 flex justify-between items-center">
      <span>Status Database: <strong id="status-text" class="text-yellow-400">Menghubungkan...</strong></span>
      <button onclick="fetchDataSPBU()" class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-white text-xs">Refresh</button>
    </div>

    <!-- Grid Menu Utama -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      
      <!-- Card: Histori -->
      <div onclick="openMenu('Histori')" class="bg-gray-800/60 hover:bg-gray-800 border border-gray-700/40 p-4 rounded-2xl cursor-pointer transition">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white mb-3">
          <i data-lucide="history" class="w-5 h-5"></i>
        </div>
        <h2 class="font-semibold text-sm">Histori</h2>
        <p class="text-xs text-gray-400">Riwayat transaksi</p>
      </div>

      <!-- Card: POM -->
      <div onclick="openMenu('POM')" class="bg-gray-800/60 hover:bg-gray-800 border border-gray-700/40 p-4 rounded-2xl cursor-pointer transition">
        <div class="w-10 h-10 rounded-xl bg-red-500 flex items-center justify-center text-white mb-3">
          <i data-lucide="fuel" class="w-5 h-5"></i>
        </div>
        <h2 class="font-semibold text-sm">POM</h2>
        <p class="text-xs text-gray-400">Catat transaksi</p>
      </div>

      <!-- Card: Arsip -->
      <div onclick="openMenu('Arsip')" class="bg-gray-800/60 hover:bg-gray-800 border border-gray-700/40 p-4 rounded-2xl cursor-pointer transition">
        <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center text-white mb-3">
          <i data-lucide="image" class="w-5 h-5"></i>
        </div>
        <h2 class="font-semibold text-sm">Arsip</h2>
        <p class="text-xs text-gray-400">Gambar tersimpan</p>
      </div>

      <!-- Card: Struk -->
      <div onclick="openMenu('Struk')" class="bg-gray-800/60 hover:bg-gray-800 border border-gray-700/40 p-4 rounded-2xl cursor-pointer transition">
        <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-white mb-3">
          <i data-lucide="file-edit" class="w-5 h-5"></i>
        </div>
        <h2 class="font-semibold text-sm">Struk</h2>
        <p class="text-xs text-gray-400">Pilih, edit & cetak</p>
      </div>

    </div>

    <!-- Accordion: Contoh Struk -->
    <div class="bg-gray-800/60 border border-gray-700/40 rounded-2xl p-4 mb-4 flex justify-between items-center cursor-pointer">
      <span class="font-medium text-sm">Contoh struk</span>
      <i data-lucide="chevron-down" class="w-5 h-5 text-gray-400"></i>
    </div>

    <!-- Grid Menu Sekunder -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      
      <!-- Card: Operator -->
      <div onclick="openMenu('Operator')" class="bg-gray-800/60 hover:bg-gray-800 border border-gray-700/40 p-4 rounded-2xl cursor-pointer transition">
        <div class="w-10 h-10 rounded-xl bg-indigo-500 flex items-center justify-center text-white mb-3">
          <i data-lucide="user-cog" class="w-5 h-5"></i>
        </div>
        <h2 class="font-semibold text-sm">Operator</h2>
        <p class="text-xs text-gray-400">Tambah nama</p>
      </div>

      <!-- Card: BBM -->
      <div onclick="openMenu('BBM')" class="bg-gray-800/60 hover:bg-gray-800 border border-gray-700/40 p-4 rounded-2xl cursor-pointer transition">
        <div class="w-10 h-10 rounded-xl bg-pink-500 flex items-center justify-center text-white mb-3">
          <i data-lucide="gauge" class="w-5 h-5"></i>
        </div>
        <h2 class="font-semibold text-sm">BBM</h2>
        <p class="text-xs text-gray-400">Update harga</p>
      </div>

      <!-- Card: SPBU -->
      <div onclick="openMenu('SPBU')" class="bg-gray-800/60 hover:bg-gray-800 border border-gray-700/40 p-4 rounded-2xl cursor-pointer transition">
        <div class="w-10 h-10 rounded-xl bg-teal-500 flex items-center justify-center text-white mb-3">
          <i data-lucide="building-2" class="w-5 h-5"></i>
        </div>
        <h2 class="font-semibold text-sm">SPBU</h2>
        <p class="text-xs text-gray-400">Edit alamat</p>
      </div>

      <!-- Card: Font -->
      <div onclick="openMenu('Font')" class="bg-gray-800/60 hover:bg-gray-800 border border-gray-700/40 p-4 rounded-2xl cursor-pointer transition">
        <div class="w-10 h-10 rounded-xl bg-indigo-400 flex items-center justify-center text-white mb-3">
          <i data-lucide="type" class="w-5 h-5"></i>
        </div>
        <h2 class="font-semibold text-sm">Font</h2>
        <p class="text-xs text-gray-400">Upload .ttf .otf</p>
      </div>

    </div>
  </div>

  <!-- Modal POM / Catat Transaksi -->
  <div id="modal-pom" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-800 p-6 rounded-2xl w-full max-w-sm border border-gray-700">
      <h3 class="text-lg font-bold mb-4">Catat Transaksi SPBU</h3>
      <form id="form-transaksi" onsubmit="simpanTransaksi(event)">
        <div class="mb-3">
          <label class="block text-xs text-gray-400 mb-1">Jenis BBM</label>
          <select id="input-bbm" class="w-full bg-gray-700 text-white p-2 rounded-xl border border-gray-600 text-sm">
            <option value="Pertalite">Pertalite</option>
            <option value="Pertamax">Pertamax</option>
            <option value="Solar">Solar</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="block text-xs text-gray-400 mb-1">Jumlah Liter</label>
          <input type="number" step="0.01" id="input-liter" required class="w-full bg-gray-700 text-white p-2 rounded-xl border border-gray-600 text-sm" placeholder="Contoh: 10.5">
        </div>
        <div class="mb-3">
          <label class="block text-xs text-gray-400 mb-1">Total Harga (Rp)</label>
          <input type="number" id="input-total" required class="w-full bg-gray-700 text-white p-2 rounded-xl border border-gray-600 text-sm" placeholder="Contoh: 100000">
        </div>
        <div class="mb-4">
          <label class="block text-xs text-gray-400 mb-1">Operator</label>
          <input type="text" id="input-operator" required class="w-full bg-gray-700 text-white p-2 rounded-xl border border-gray-600 text-sm" placeholder="Nama Operator">
        </div>
        <div class="flex space-x-2">
          <button type="button" onclick="closeModal('modal-pom')" class="w-1/2 bg-gray-600 py-2 rounded-xl text-sm font-medium">Batal</button>
          <button type="submit" class="w-1/2 bg-red-600 hover:bg-red-500 py-2 rounded-xl text-sm font-medium">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Integration -->
  <script>
    lucide.createIcons();

    // URL Web App Apps Script
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzAqk8wNmBDwkKMk3Kf76d_MyJiuh299_lDMTZEMbLFNebFbjMges2ZZ4DODWAibQvA/exec";

    let globalDataSPBU = null;

    // Fetch Data dari Google Sheets
    async function fetchDataSPBU() {
      const statusText = document.getElementById('status-text');
      statusText.innerText = 'Memuat data...';
      statusText.className = 'text-yellow-400';

      if (!GAS_WEB_APP_URL) {
        statusText.innerText = 'URL API belum terpasang!';
        statusText.className = 'text-red-400';
        return;
      }

      try {
        const response = await fetch(GAS_WEB_APP_URL);
        const result = await response.json();
        
        globalDataSPBU = result;
        statusText.innerText = 'Terhubung';
        statusText.className = 'text-emerald-400';
        console.log("Data terload:", globalDataSPBU);
      } catch (error) {
        console.error("Error:", error);
        statusText.innerText = 'Gagal terhubung';
        statusText.className = 'text-red-400';
      }
    }

    // Buka Modal Berdasarkan Menu
    function openMenu(menuName) {
      if (menuName === 'POM') {
        document.getElementById('modal-pom').classList.remove('hidden');
      } else {
        alert(`Menu [${menuName}] sedang dalam tahap pembuatan modal.`);
      }
    }

    // Tutup Modal
    function closeModal(modalId) {
      document.getElementById(modalId).classList.add('hidden');
    }

    // Kirim Data Transaksi Baru
    async function simpanTransaksi(event) {
      event.preventDefault();
      
      const payload = {
        id: "TRX-" + Date.now(),
        tanggal: new Date().toLocaleString('id-ID'),
        jenis_bbm: document.getElementById('input-bbm').value,
        liter: document.getElementById('input-liter').value,
        total: document.getElementById('input-total').value,
        operator: document.getElementById('input-operator').value
      };

      try {
        const btn = event.target.querySelector('button[type="submit"]');
        btn.innerText = 'Menyimpan...';
        btn.disabled = true;

        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert('Transaksi berhasil disimpan ke Google Sheets!');
        closeModal('modal-pom');
        event.target.reset();
      } catch (error) {
        alert('Gagal menyimpan transaksi: ' + error.message);
      } finally {
        const btn = event.target.querySelector('button[type="submit"]');
        btn.innerText = 'Simpan';
        btn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', fetchDataSPBU);
  </script>
</body>
</html>
